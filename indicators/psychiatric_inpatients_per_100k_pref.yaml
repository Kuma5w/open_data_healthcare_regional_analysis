    - {name: inpatients_involuntary, label: うち措置入院患者数（緊急措置入院を含む）, unit: 人}
    - {name: population, label: 総人口, unit: 人}
    - {name: inpatients_per_100k, label: 人口10万人あたり在院患者数, unit: 人／10万人}

