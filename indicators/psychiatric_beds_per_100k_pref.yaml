id: psychiatric_beds_per_100k_pref
version: 0.1.0
status: draft
name: 都道府県ごとの人口10万人あたり精神病床数
short_description: 精神病床（許可病床）が人口に対してどれくらいあるかを、都道府県ごとに比べる
unit_of_analysis: prefecture
unit_note: 都道府県（政令指定都市の分を含む）。630調査の施設概要は都道府県と政令指定都市ごとの集計表で、構想区域や市区町村の値はない。

numerator:
  description: 精神病床を有する病院の許可精神病床数（休床中の病棟を含む）。内訳として、精神保健福祉法の区分（国立・都道府県立精神科病院等・指定病院・非指定病院）ごとの病床数も出す
  dataset: mental_health_630_facility_r7
  as_of: 2025年6月30日
denominator:
  description: 総人口（住民基本台帳の総計）
  dataset: population_jumin_r8
  as_of: 2026年1月1日
formula: 許可精神病床数 ÷ 総人口 × 100,000

intent: >
  改正医療法により、地域医療構想に精神医療が位置付けられた（地域医療構想策定ガイドライン Ⅰ-３）。国のワーキンググループで精神医療の地域医療構想のガイドラインが検討されている（2026年度中に結論の予定）。精神病床の量を都道府県ごとに同じ方法で比べる入口の指標。基準病床数・必要病床数の議論では、人口当たりの入院患者数や病床数の地域差が出発点になる。

why_this_denominator: >
  精神病床は全年齢の住民が使うため、総人口を分母にした（医療計画の指標も人口10万対）。許可病床を使い、届出病床（稼働の届出がある病床）は使っていない。届出病床は休床などで年により動くが、許可病床は病床の枠を表すため。WG資料の病床利用率も許可病床を分母にしている。

interpretation: >
  値が大きいほど、人口に対して精神病床が多い。病床が多いことは、入院の受け皿が多いことと、長期入院が多い構造の、両方の意味がありうる。在院患者数・病床利用率の指標と合わせて見る。

policy_questions:
  - 人口に対して精神病床が多い（少ない）都道府県はどこか
  - 精神病床のうち、国公立・指定病院・非指定病院がそれぞれどれくらいを占めるか

caveats:
  - 630調査（精神保健福祉資料）の医療機関票の集計表で、令和7年6月30日の1日の状況。在院患者数・入院形態別の患者数もその日の人数。
  - 公表されているのは都道府県と政令指定都市ごとの集計だけで、医療機関ごとの値や構想区域ごとの値はない。精神医療の地域医療構想をどの単位で考えるか（都道府県か構想区域か）は国のワーキンググループで検討中。
  - 医療機関の所在地の都道府県で数えている。患者が都道府県をまたいで入院する流出入は反映しない。
  - 都道府県の値には政令指定都市の分が含まれる。医療機関が提出した値の集計で、公表元は「提出票に矛盾する数値があると合計が一致しない場合がある」としている（令和7年度の施設概要では、都道府県の合計と全国の行、表どうしの内訳はすべて一致した）。
  - 精神病床を有しない医療機関（クリニックなど）は含まない。
  - 許可病床には休床中の病棟の病床を含む。
  - 人口は住民基本台帳（2026年1月1日）の総数。調査の時点（2025年6月30日）と半年ずれる。ほかの人口あたりの指標とそろえた。

alternatives:
  - id: psychiatric_inpatients_per_100k_pref
    reason: 病床ではなく、在院患者の数で見る
  - id: psychiatric_bed_occupancy_pref
    reason: 病床がどれくらい使われているかを見る

authors:
  - name: H.I.

script: indicators/psychiatric_beds_per_100k_pref.py

output:
  area_code: pref_code
  area_name: pref_name
  value: beds_per_100k
  numerator: beds_licensed
  denominator: population
  scale: 100000
  digits: 1
  unit: 床／人口10万人
  columns:
    - {name: pref_code, label: 都道府県コード}
