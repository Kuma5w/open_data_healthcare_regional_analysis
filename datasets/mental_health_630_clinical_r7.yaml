notes:
- 医療機関ごとの値はない。都道府県（政令指定都市の分を含む）と政令指定都市ごとの集計表で、変換後は1行＝表×地域。表の区分は施設概要（mental_health_630_facility_r7）と同じ。
- 人数・件数は6月の1か月の値。医療機関の数（専門外来・拠点・届出の有無、精神科救急医療体制整備事業の役割など）は令和7年6月30日時点。
- 6月の新規入院患者数は、届出病床数を大きく上回る回答を公表元が補正している。6月の外来受診患者数は、過去の調査の回答と大きく乖離する医療機関を集計から除いている（定義書 teigisyo(R7_630).pdf）。
- 「医療保護入院の1年間転帰（都道府県別）」のシートは data/processed/<output>__outcome_1y.parquet。2024年6月に医療保護入院で入院した患者（全国13,861人）の、3か月・6か月・1年時点の退院率と、内訳の割合（0〜1）。列は codebooks/<id>.csv の table＝outcome_1y の行。
- 精神病床を有しない医療機関（表9〜11）は回答率が都道府県で約20〜100％と違う（施設概要の回答率の表）。精神科救急医療体制整備事業の役割の列は、表9〜11では空欄。
