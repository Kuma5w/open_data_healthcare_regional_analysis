id: homecare_offices_per_65plus
version: 0.2.0
status: draft
name: 65歳以上人口1万人あたり訪問介護事業所数
short_description: 高齢者人口に対する訪問介護の拠点の多さを、市区町村ごとに同じ方法で比べる入口の指標
unit_of_analysis: municipality
unit_note: >
  政令指定都市は市単位に集約する（介護保険の保険者が市であり、介護保険事業計画も市単位で立てるため）。
  区単位で見たいときは --ward-level で出力できる。

numerator:
  description: 訪問介護事業所数（事業所番号で重複を除いた件数。都道府県コードの行は除外）
  dataset: kaigo_jigyosho_110
  as_of: 2026年6月末
denominator:
  description: 65歳以上人口（総計＝日本人住民＋外国人住民）
  dataset: population_jumin_r8
  as_of: 2026年1月1日
formula: 訪問介護事業所数 ÷ 65歳以上人口 × 10,000

intent: >
  在宅で暮らす高齢者を支える訪問介護の拠点が、地域によってどれくらい偏っているかを、
  全国で同じ方法で比べるための入口の指標。新たな地域医療構想で在宅医療・介護の受け皿や
  在宅医療等連携機能を議論するとき、まず「拠点が少ない地域」を見つける目的で作った。
  供給量そのものではなく、拠点の分布を見ている。

why_this_denominator: >
  需要に最も近いのは要介護認定者数だが、認定率そのものに地域差があり、それが指標に混ざる。
  まずは人口を分母にして拠点の分布を比べ、認定者数を分母にした版は別の指標として並べる方針にした。
  75歳以上人口の方が訪問介護の利用者に近いが、他の高齢者向け指標と分母を揃えるため65歳以上を基本にした。

interpretation: >
  値が大きいほど、65歳以上人口に対して訪問介護事業所が多い。事業所の規模（職員数・訪問回数）は
  反映しないため、値が大きくても供給量が多いとは限らない。人口の少ない町村では1事業所の差で値が大きく変わる。

policy_questions:
  - 在宅医療・介護の受け皿が少ない市区町村はどこか
  - 在宅医療等連携機能を担う医療機関の周辺に、訪問介護の拠点があるか

caveats:
  - 事業所数であり、職員数や訪問回数などの供給量は反映しない。「定員」列は訪問介護では0の例があり、供給量の代わりには使えない。
  - 事業所の所在市区町村で数えている。市区町村の境界を越えた訪問は反映しない。
  - コード列「都道府県コード又は市町村コード」は、2026年6月末時点のファイル（35,166事業所）で住所・市区町村名と照合した範囲では事業所の所在市区町村を示していた（公式の項目定義は未確認）。都道府県コード（下3桁000）の行があれば除外し、件数を実行記録に残す。
  - 分子（6月末）と分母（1月1日）の時点がずれている。
  - 人口の少ない町村では値が不安定。地図にするときは人口規模を併記するか、平滑化（経験ベイズ推定など）を検討する。
  - 休止中の事業所が含まれるかどうかは未確認。
  - 市町村合併をまたぐ年の比較では、reference/ の対応表で現在のコードに揃える。

alternatives:
  - id: homecare_offices_per_75plus
    reason: 訪問介護の利用は75歳以上に多く、需要により近い分母
  - id: homecare_offices_per_certified
    reason: 要介護認定者数を分母にすると需要に近いが、認定率の地域差が混ざる

authors:
