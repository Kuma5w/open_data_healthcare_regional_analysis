    - {name: hospitals, label: 精神病床を有する病院数, unit: 病院}
    - {name: beds_licensed, label: 許可精神病床数, unit: 床}
    - {name: beds_public, label: うち国立・都道府県立精神科病院等, unit: 床}
    - {name: beds_designated_hosp, label: うち指定病院, unit: 床}
    - {name: beds_nondesignated_hosp, label: うち非指定病院, unit: 床}
    - {name: population, label: 総人口, unit: 人}
    - {name: beds_per_100k, label: 人口10万人あたり精神病床数, unit: 床／10万人}

