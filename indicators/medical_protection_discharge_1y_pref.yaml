    - {name: discharged_6m, label: 6か月時点までに退院した人数, unit: 人}
    - {name: discharged_1y, label: 1年時点までに退院した人数, unit: 人}
    - {name: discharge_rate_3m_pct, label: 3か月時点の退院率, unit: ％}
    - {name: discharge_rate_6m_pct, label: 6か月時点の退院率, unit: ％}
    - {name: discharge_rate_1y_pct, label: 1年時点の退院率, unit: ％}
    - {name: support_referral_pct, label: 地域援助事業者の紹介があった割合, unit: ％}

