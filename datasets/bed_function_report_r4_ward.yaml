notes:
- 1行＝1病棟。地域別8ファイルを縦に結合する。施設の状況は令和4年7月1日時点、通年の実績は令和3年4月〜令和4年3月。
- データの表の項目名が、データ定義と39列で言い回しだけ違う（「医療機関名コード（医科）」、月別の在棟・退棟・新規入棟の「うち、」の有無など）。列の並びは一致するため、parser_options.max_item_mismatch で許している。
- 数値列の記号（*：月別1〜9件の秘匿、-：任意項目の未報告・非該当・不備、未報告又はデータ不備：必須項目の未報告・不備）は欠損にし、元の記号は <output>__flags.parquet に row_id・列・記号として残す。
- 列名は先頭の識別列のみ英字、それ以外は表の種類の接頭辞＋位置番号（年度によって位置が違う）。年度をまたいで同じ項目を使うときは、見出しで対応づける（reference/bfr_item_map.csv）。
- ファイルのURLは公表ファイル名から書いたもの（公表ページでの確認が必要）。手元のファイルを --from-dir で取り込む。
