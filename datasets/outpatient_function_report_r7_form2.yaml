notes:
- 1医療機関につき報告月0〜12の13行。報告月0は年間値で、令和7年度の公表データでは秘匿（*）がない（2026-11-26に往診料・在宅患者訪問診療料（Ⅰ）・在医総管・施医総管で確認）。年間の分析には報告月0の行を使う。
- 様式2はNDB（レセプト情報・特定健診等情報データベース）で把握できる項目で、令和6年4月〜令和7年3月診療分。
- 表の形は病床機能報告と同じ（見出し6行、データ定義の列の並びと一致）なので、病床機能報告と同じパーサー（chiiki_od.bfr）で読む。データ定義は留意事項ZIPではなく xlsx（001724277.xlsx）そのもの。
- 報告対象は、一般・療養病床を有する病院・有床診療所と、報告の意向を示した無床診療所（令和7年度留意事項）。報告の単位は医療機関（施設）。
- 数値列の記号（*：月別1〜9件の秘匿、-：任意項目の未報告など、未報告又はデータ不備）は欠損にし、元の記号は <output>__flags.parquet に残す。
- データ定義で「未回答時にゼロを入力する項目」とされた列では、空欄の回答が0として入っている（コードブックの zero_if_blank）。
- 医療機関コード（医科）（medical_code_ika）は10桁（都道府県2桁＋点数表区分1＋医療機関番号7桁）。病床機能報告・厚生局の届出受理医療機関名簿とつなぐときに使う。
- 都道府県が個別に情報を更新している場合があり、最新の報告内容は各都道府県のサイトで確認する。
