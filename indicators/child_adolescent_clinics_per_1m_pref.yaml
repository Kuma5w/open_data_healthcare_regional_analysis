id: child_adolescent_clinics_per_1m_pref
version: 0.1.0
status: draft
name: 都道府県ごとの20歳未満人口100万人あたり児童・思春期の専門外来を持つ精神科病院数
short_description: 児童・思春期の専門外来を設置している、精神病床を有する病院の数を、20歳未満人口に対して都道府県ごとに比べる
unit_of_analysis: prefecture
unit_note: 都道府県（政令指定都市の分を含む）。630調査は都道府県と政令指定都市ごとの集計表で、構想区域や市区町村の値はない。

numerator:
  description: 精神病床を有する病院のうち、児童・思春期の専門外来を設置している病院の数（医療機関の回答）。比べる目安として、精神病床を有する病院の数と設置している病院の割合も出す
  dataset: mental_health_630_clinical_r7
  as_of: 2025年6月30日
denominator:
  description: 20歳未満人口（住民基本台帳の0〜14歳と15〜19歳の合計）
  dataset: population_jumin_r8
  as_of: 2026年1月1日
formula: 児童・思春期の専門外来を設置している病院数 ÷ 20歳未満人口 × 1,000,000

intent: >
  改正医療法により、地域医療構想に精神医療が位置付けられた（地域医療構想策定ガイドライン
  Ⅰ-３）。国のワーキンググループで精神医療の地域医療構想のガイドラインが検討されている（2026年度中に結論の予定）。WG資料は、児童・思春期、依存症、認知症、うつ病、発達障害、摂食障害の専門外来を持つ医療機関の数を、都道府県別に示している（630調査の医療機関票、令和7年度）。児童・思春期の専門的な外来の受け皿が人口に対してどれくらいあるかを、都道府県ごとに同じ方法で比べるための指標。

why_this_denominator: >
  児童・思春期の専門外来の対象は子どもと思春期の若者なので、20歳未満人口を分母にした。総人口で割ると、高齢者の多い県で値が小さく出る。専門外来を持つ病院は都道府県に数か所〜数十か所と少ないので、人口100万人あたりにした。病院のうち設置している割合（clinic_share_pct）も列に出した。

interpretation: >
  値が大きいほど、20歳未満人口に対して児童・思春期の専門外来を持つ精神科病院が多い。専門外来の規模（医師の数・患者の数）や、予約の取りやすさは反映しない。0の都道府県でも、精神病床を有しない医療機関（クリニックなど）や一般病院の外来で診療していることがある。

policy_questions:
  - 児童・思春期の専門外来を持つ精神科病院が、20歳未満人口に対して少ない都道府県はどこか
  - 子どもの精神科医療の受け皿が少ない都道府県はどこか

caveats:
  - 630調査（精神保健福祉資料）医療機関票の集計表。医療機関の数は令和7年6月30日時点。
  - 公表されているのは都道府県と政令指定都市ごとの集計だけで、医療機関ごとの値や構想区域ごとの値はない。精神医療の地域医療構想をどの単位で考えるか（都道府県か構想区域か）は国のワーキンググループで検討中。
  - 医療機関の所在地の都道府県で数えている。患者が都道府県をまたいで受診・入院する流出入は反映しない。都道府県の値には政令指定都市の分が含まれる。
  - 精神病床を有する病院だけを数えている。精神病床を有しない医療機関（クリニックなど）の表は、都道府県ごとの回答率が約20〜100％と違うため使っていない。
  - 「専門外来」の定義は、630調査の定義書（teigisyo(R7_630).pdf）に書かれていない。医療機関が「設置している」と回答したものを数えている。
  - 人口は住民基本台帳（2026年1月1日）の20歳未満人口。調査の時点（2025年6月30日）と半年ずれる。

alternatives:
  - id: addiction_clinics_per_1m_pref
    reason: ほかの専門外来（依存症）
  - id: dementia_clinics_per_1m_pref
    reason: ほかの専門外来（認知症）
  - id: psy_emergency_hospitals_per_1m_pref
    reason: 精神科救急の体制と合わせて見る

authors:
  - name: H.I.

script: indicators/child_adolescent_clinics_per_1m_pref.py

output:
  area_code: pref_code
  area_name: pref_name
  value: clinic_hospitals_per_1m
  numerator: clinic_hospitals
  denominator: population
  scale: 1000000
  digits: 2
  unit: 病院／20歳未満人口100万人
  columns:
    - {name: pref_code, label: 都道府県コード}
    - {name: pref_name, label: 都道府県名}
    - {name: hospitals, label: 精神病床を有する病院数, unit: 病院}
    - {name: clinic_hospitals, label: 児童・思春期の専門外来を設置している病院数, unit: 病院}
    - {name: clinic_share_pct, label: 設置している病院の割合, unit: ％}
    - {name: population, label: 20歳未満人口, unit: 人}
    - {name: clinic_hospitals_per_1m, label: 20歳未満人口100万人あたり児童・思春期の専門外来を持つ病院数, unit: 病院／20歳未満人口100万人}

