id: zaitaku_renkei_trend_hospital
version: 0.1.0
status: draft
hidden_from_site:
  reason: 作成者の確認が済むまで、サイトに出さない（千葉県の結果との照合と、病院の照合方法を作成者と相談中）
  since: "2026-11-27"
name: 在宅医療等連携機能の該当項目数の推移（病院別、FY2020〜2024）
short_description: P・S・C判定の18項目のうち病床機能報告で毎年追える11項目について、病院ごとに満たした項目の数と○×を年度ごとに示す
unit_of_analysis: facility
unit_note: >
  1行＝病院×年度（実績年度。FY2020＝令和3年度報告 … FY2024＝令和7年度報告）。対象は令和7年度のP・S・C判定の対象病院と、
  過年度でそれにつながる病院（オープンデータ医療機関コード、医療機関コード（医科）、法人名を除いた名称の順で照合）。
  病院名と医療機関コードは載せず、番号と伏せた名前（「区域名・A病院」）はP・S・C判定の病院別の指標と同じ。
  表と都道府県の値は最新の年度（FY2024）、推移のグラフはすべての年度。地図には載らない。

numerator:
  description: 11項目（P4、S1〜S6、C1〜C4）のうち、基準を満たした項目の数。判定の基準は P・S・C判定（zaitaku_renkei_psc_hospital）と同じ
  dataset: bed_function_report_r7_ward
  as_of: 各年度の7月1日（病床）・前年度の実績
denominator:
  description: 割合の基準の分母。P4・S1・S3は退院患者数、C1は新規入棟患者数、C2・C3は退棟患者数（いずれも各年度の病棟票、病院ごとに合計）
  dataset: bed_function_report_r7_ward
  as_of: 各年度の前年度の実績
datasets:
  - bed_function_report_r7_facility
  - bed_function_report_r7_form2_monthly
  - bed_function_report_r7_form2_annual
  - outpatient_function_report_r7_form2
  - kouseikyoku_todokede_ika_r8
  - bed_function_report_r6_ward
  - bed_function_report_r6_form2_monthly
  - bed_function_report_r5_ward
  - bed_function_report_r5_form2_monthly
  - bed_function_report_r4_ward
  - bed_function_report_r4_form2_monthly
  - bed_function_report_r3_ward
  - bed_function_report_r3_form2_monthly
formula: 年度ごとに、項目ごとに「件数の基準以上、または割合の基準以上」で○。○の数（0〜11）が該当項目数

intent: >
  在宅医療等連携機能（P・S・C）の判定のうち、病床機能報告で毎年追える11項目を、令和7年度と同じ基準で各年度に当てはめ、
  病院ごとに、在宅医療への関わりが5年度でどう変わったかを見るための指標。
  千葉県で D.S.氏が調整会議の資料（病院別の該当項目数の推移）として作った方法を、全国に同じ基準で当てはめた。
  届出（P5・S7）、外来機能報告の件数（P1〜P3）、看取り（P6・C5）は過年度を同じ形でそろえられないため含めない。
  そのため類型（P・S・C）は年度ごとには判定せず、該当項目数と、項目ごとの○×で推移を見る。

why_this_denominator: >
  P・S・C判定と同じく、項目ごとに実数の基準を置き、割合は「または」の条件にした（小規模病院を拾うため）。
  割合の分母は、P4・S1・S3が退院患者数、C1が新規入棟患者数、C2・C3が退棟患者数。
  病院の値は該当項目数そのもので、割り算はしていない。全国・都道府県の線は、病院の該当項目数の平均。

interpretation: >
  該当項目数が増えた病院は、在宅医療等連携機能に関わる実績の幅が広がっている。どの項目が○になったかで、何が変わったかを確かめる。
  年度の間の変化には、病院の実績の変化のほか、病床の転換、報告の誤りや未報告、診療報酬改定による算定の変化（入退院支援加算3は令和7年度報告から）が含まれる。
  判定は実績要件に照らした機械的なもので、特定の病院の役割や再編の可否を決めるものではない。

policy_questions:
  - 在宅医療等連携機能の実績が広がっている（狭まっている）病院はどこか
  - 後方支援（S）や介護施設等との連携（C）の項目を、近年新たに満たすようになった病院はどれくらいあるか

caveats:
  - 様式2の件数（S1〜S6・C4）は、すべての年度で月別票から推計した（公表値の合計＋非公表「*」の月数×補完値）。過年度には年間合計票がないため、令和7年度も同じ方法にそろえた。そのため令和7年度（FY2024）の○×は、P・S・C判定の星取り表（年間合計票の実数による）と一部ずれる（全国で S3 520病院、S4 186、S6 137 など。千葉県で最大は S3 の22病院で、D.S.氏の結果と同じ）。実数の列（S1_value など）も推計値。
  - 補完値は、令和7年度の年間合計票の実数と月別票の公表値の差を、非公表の月数で割った値（都道府県ごと・項目ごと、1〜9に丸める。非公表の月がない都道府県は全国の値）。千葉県の値は D.S.氏の値と一致した。
  - 入退院支援加算３は令和7年度報告から様式2の項目になったため、FY2020〜2023 は0としてS1を判定した。
  - 病床初期加算は令和4年度改定で再編された。R3・R4報告の旧名の項目を、令和7年度の項目に対応させた。列の対応は reference/bfr_item_map.csv。
  - 過年度の病院は、オープンデータ医療機関コード→医療機関コード（医科）→同じ都道府県で法人名を除いた名称（1対1）の順で令和7年度の病院につないだ。令和3年度報告には医療機関コード（医科）がない。つながらない病院（令和7年度までの廃止や、名称と番号の両方が変わった病院）はこの表に含めない（構想区域別の推移には含める）。
  - 報告しなかった年度のある病院は、その年度の行がない。
  - 判定不能（「－」）：様式1の患者数が桁違いの病院（1床当たりの新規入棟または退棟が年100人超）は P4・C1〜C3 を「－」にし、該当しないものとして数えた。
  - P4の「退院後1か月以内に自院が在宅医療を提供する予定の患者」は実施予定「不明」が多い病院があり、過小になりうる。
  - 基準値は千葉県R7報告で決めたものを全国・全年度に当てはめている。
  - 病院名を伏せているが、値は公表データから計算できるため、匿名化ではない。照合のための番号の付け方や、手元で病院名つきの表を出す方法は、作成者と検討中。

