notes:
- 各厚生局のサイトの「届出受理医療機関名簿」（施設基準の届出受理状況）から、医科のファイルを手動でダウンロードして --from-dir で取り込む。ファイル名は厚生局ごとに違う（local_name）。
- 1行＝1医療機関×1つの届出（縦長の表）。都道府県コード・医療機関番号（7桁）・医療機関名称・所在地・病床数・受理届出名称・受理記号・受理番号・算定開始年月日などの24列。
- 東北厚生局は1ファイルに6県のシート、中国四国厚生局の中国5県は医科・歯科・薬局が1ファイル（区分の列で医科だけを残す）。
- medical_code は医療機関コード（10桁）＝都道府県コード＋点数表区分（医科は1）＋医療機関番号。病床機能報告・外来機能報告の「医療機関コード（医科）」とつなぐときに使う。
- 受理記号の例：支援病１（機能強化型の在宅療養支援病院・単独型）、支援病２（同・連携型）、支援病３（それ以外の在宅療養支援病院）、在後病（在宅療養後方支援病院）。受理届出名称は長い正式名称なので、判定には受理記号を使う。
- 時点は東北・関東信越が令和8年10月1日、それ以外が11月1日現在（2行目の表記による。as_of 列）。
- 「市町村コード」「市町村名」の列は空欄の厚生局がある。
