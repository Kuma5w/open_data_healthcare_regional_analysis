id: visiting_nursing_offices_per_65plus
version: 0.1.0
status: draft
name: 65歳以上人口1万人あたり訪問看護事業所数
short_description: 在宅医療を支える訪問看護の拠点の多さを、市区町村ごとに同じ方法で比べる入口の指標
unit_of_analysis: municipality
unit_note: >
  政令指定都市は市単位に集約する（介護保険の保険者が市であり、介護保険事業計画も市単位で立てるため）。
  区単位で見たいときは --ward-level で出力できる。

numerator:
  description: 訪問看護事業所数（事業所番号で重複を除いた件数。訪問看護ステーションのほか、介護保険のみなし指定で訪問看護を行う病院・診療所を含む）
  dataset: kaigo_jigyosho_130
  as_of: 2026年6月末
denominator:
  description: 65歳以上人口（総計＝日本人住民＋外国人住民）
  dataset: population_jumin_r8
  as_of: 2026年1月1日
formula: 訪問看護事業所数 ÷ 65歳以上人口 × 10,000

intent: >
  在宅医療を支える訪問看護の拠点が、地域によってどれくらい偏っているかを、全国で同じ方法で比べるための入口の指標。
  地域医療構想策定ガイドラインは、在宅医療の協議で確認するデータに訪問看護ステーション数を挙げ、
  在宅医療等連携機能を担う医療機関が訪問看護ステーション等と連携して患者の状態の変化を早く捉える役割を示している。
  まず「訪問看護の拠点が少ない地域」を見つけ、訪問介護（homecare_offices_per_65plus）など他の在宅サービスと並べて見る目的で作った。

why_this_denominator: >
  訪問介護など他の介護サービスの指標と分母を揃え、在宅を支えるサービスを横に並べて比べられるようにした。
  訪問看護は医療保険でも提供され、小児や医療的ケア児など65歳未満の利用者もいるため、65歳以上人口と需要の対応は訪問介護よりゆるい。
  総人口や75歳以上人口、要介護認定者数を分母にした版も考えられる。

interpretation: >
  値が大きいほど、65歳以上人口に対して訪問看護の事業所が多い。看護職員の数、24時間対応の体制の有無、訪問回数は反映しないため、
  値が大きくても提供量が多いとは限らない。人口の少ない町村では1事業所の差で値が大きく変わる。

policy_questions:
  - 在宅医療を支える訪問看護の拠点が少ない市区町村はどこか
  - 在宅医療等連携機能を担う医療機関の周辺に、訪問看護の拠点があるか

caveats:
  - 訪問看護ステーションのほか、病院・診療所が行う訪問看護（介護保険のみなし指定）を含む。病院・診療所の数は「うち病院・診療所」の列に再掲した（事業所番号の3桁目が1・3のもの）。訪問看護ステーションだけの数は、全体からこの列を引くとおおよそ分かる。
  - 本体と同じ事業所番号でサテライトが別の行に載っている例が1組あり（静岡市の2つの区）、1件として数えた。サテライトが別の行に載っていない場合、サテライトの所在地では数えられない。
  - 看護職員数・24時間対応の有無（ガイドラインが挙げる項目）はこのデータにない。
  - 事業所数であり、職員数・利用定員・提供回数などの供給量は反映しない。「定員」列は0や空欄が多く、桁の大きすぎる値もあるため、供給量の代わりには使えない。
  - 事業所の所在市区町村で数えている（公表ページの注記では「事業所所在地の市町村コード」）。市区町村の境界を越えた利用は反映しない。
  - 介護サービス情報公表システムに載っている事業所だけを数える。休止中の事業所が含まれるかどうかは未確認。
  - 分子（2026年6月末）と分母（2026年1月1日）の時点がずれている。
  - 市町村合併をまたぐ年の比較では、reference/ の対応表で現在のコードに揃える。

alternatives:
  - id: homecare_offices_per_65plus
    reason: 訪問介護の拠点と並べて、在宅を支えるサービスの偏りを比べる
  - id: visiting_rehab_offices_per_65plus
    reason: 訪問で行うリハビリテーションの拠点と並べて見る

authors:
  - name: H.I.

script: indicators/visiting_nursing_offices_per_65plus.py

output:
  area_code: municipality_code5
  area_name: municipality_name
  value: offices_per_10k_65plus
  numerator: offices
  denominator: pop_65plus
  scale: 10000
  digits: 3
  unit: 事業所／65歳以上人口1万人
  columns:
    - {name: municipality_code5, label: 市区町村コード}
    - {name: municipality_name, label: 市区町村名}
    - {name: offices, label: 訪問看護事業所数, unit: 事業所}
    - {name: offices_medical, label: うち病院・診療所（事業所番号の区分による）, unit: 事業所}
    - {name: pop_65plus, label: 65歳以上人口, unit: 人}
    - {name: offices_per_10k_65plus, label: 65歳以上人口1万人あたり事業所数, unit: 事業所／1万人}

