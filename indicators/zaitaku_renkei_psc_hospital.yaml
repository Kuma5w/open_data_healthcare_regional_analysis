id: zaitaku_renkei_psc_hospital
version: 0.1.1
status: draft
hidden_from_site:
  reason: 作成者の確認が済むまで、サイトに出さない（千葉県の結果との照合と、病院の照合方法を作成者と相談中）
  since: "2026-11-27"
name: 在宅医療等連携機能の類型（P・S・C）と星取り表（病院別）
short_description: 病院ごとに在宅医療に関わる18項目を実数の基準と比べ、P・S・Cの3類型を判定し、どの項目を満たすかを○×で示す
unit_of_analysis: facility
unit_note: >
  1行＝1病院（一般・療養病床を持つ病院）。病院名と医療機関コードは載せず、構想区域ごとに「区域名・A病院」の形で伏せる。
  順は該当項目数の多い順、同じ数の中は医療機関コードから作った乱数の順（公表ファイルの並びと関係しない）。地図には載らない。

numerator:
  description: 18項目の実数（外来機能報告 様式2の年間値、病床機能報告の施設票・病棟票・様式2年間合計票、厚生局の届出受理医療機関名簿）。項目の一覧と基準は chiiki_od.zaitaku_psc.ITEMS
  dataset: bed_function_report_r7_ward
  as_of: 令和7年7月1日（病床）・令和6年度実績・令和8年10・11月（届出）
denominator:
  description: 割合の基準の分母。P4・S1・S3は退院患者数、C1は新規入棟患者数、C2・C3は退棟患者数（いずれも病棟票、病院ごとに合計）
  dataset: bed_function_report_r7_ward
  as_of: 令和6年度実績
datasets:
  - bed_function_report_r7_facility
  - bed_function_report_r7_form2_annual
  - outpatient_function_report_r7_form2
  - kouseikyoku_todokede_ika_r8
formula: 項目ごとに「件数の基準以上、または割合の基準以上」で○。P 6項目中3以上・S 7項目中4以上・C 5項目中3以上で類型に該当（複数は併記、なしは「—」）

intent: >
  新たな地域医療構想で病院に求められる「在宅医療等連携機能」を、病院ごとに、実数で説明できる形で評価するための指標。
  病床機能報告・外来機能報告・厚生局の届出から在宅医療に関わる18項目をとり、項目ごとに実数の基準と比べて、
  P（自院で在宅医療を実施）・S（在宅療養の後方支援）・C（介護施設等との連携）の3つの「在宅医療機能の類型」を判定する。
  類型だけでなく、病院×18項目の○×（星取り表）を必ず示し、どの項目が足りないかを見えるようにする。
  千葉県のR7報告（256病院）で、地域医療構想の調整会議に出す資料として確定した方法を、全国に同じ基準で当てはめた。

why_this_denominator: >
  県内順位（パーセンタイル）や総合スコアは使わず、項目ごとに実数の基準を置いた。実数の大きさで評価する方が説明しやすいため。
  基準は件数が主で、割合は「または」の条件にした。小規模病院を拾うため。件数の少ない項目には割合の基準を置いていない。
  割合の分母は、P4・S1・S3が退院患者数（病棟票「当該病棟から退院した患者数」）、C1が新規入棟患者数、C2・C3が退棟患者数。
  看取りは2つに分け、医療機関以外での看取りをP、医療機関での看取りをCに入れた。
  基準値は、診療報酬に実績要件があるものはそれを年換算し（地域包括ケア病棟の在宅医療等の実績、機能強化型在宅療養支援病院の要件）、
  ないものは千葉県で実績のある病院（値＞0）の中央値を丸めた値。全国でも千葉県R7の基準値をそのまま使っている（全国の中央値で置き直すと結果は変わる）。

interpretation: >
  類型に該当する病院は、その機能について実数の基準を過半の項目で満たしている。該当しないことは、その機能がないことを意味しない（届出や実績の報告のしかた、基準との相性による）。
  該当項目数（items_met）は18項目のうち○の数で、類型の判定とは別に、どれだけ幅広く在宅医療に関わっているかの目安になる。
  判定は実績要件に照らした機械的なもので、特定の病院の役割や再編の可否を決めるものではない。

policy_questions:
  - 在宅医療等連携機能を担う病院（P・S・C）は、構想区域の中にどれくらいあり、どの類型が足りないか
  - 在宅療養支援病院の届出がある病院で、実績の項目を満たしていないのはどの項目か（届出と実績のずれ）

caveats:
  - 基準値は千葉県R7報告で決めたものを全国に当てはめている。地域ごとの実績の分布の違いは反映しない。
  - 診療報酬の実績要件は報告項目と定義が一致しない。たとえばP2は機能強化型在支病の「緊急往診」の要件を、往診料全体の件数で代用している。
  - 病床初期加算（C4）は、在宅からの受入と急性期後の受入を区別できない。
  - P4の「退院後1か月以内に自院が在宅医療を提供する予定の患者」は、実施予定が「不明」の患者が多い病院があり（千葉県で退院患者の22.7％、全国の対象病院で6.6％）、過小になりうる。
  - 実績年度（令和6年度）、病床の時点（令和7年7月1日）、届出の時点（令和8年10月1日または11月1日）が異なる。
  - 判定不能（「－」）：様式1の患者数が桁違いの病院（1床当たりの新規入棟または退棟が年100人超、全国14病院）はP4・C1〜C3を、外来機能報告とつながらない病院（全国48病院）はP1〜P3を「－」にした。「－」の項目は該当しないものとして数え、類型の基準（6項目中3以上など）は変えていない。
  - 外来機能報告とは医療機関コード（医科）で、つながらなければオープンデータ医療機関コードでつないだ。厚生局の名簿とは医療機関コードで、一致しなければ同じ都道府県で法人名を除いた名称が1対1で一致するもの（全国52病院）でつないだ。どちらでもつながらない病院（全国83病院）は届出なしとして扱った。
  - 様式2の件数は令和7年度の年間合計票の実数（秘匿なし）。月別票の「*」を補完した値は使っていない。様式2に行がない病院（全国24病院）は0とした。
  - 千葉県で作り直した結果は、病院数256・C 108（9区域とも一致）・いずれか139がD.S.氏の結果と一致し、P 62（D.S.氏60）・S 35（同34）・PかつC 44（同42）が少し多かった。差は基準ちょうどの病院の扱いや照合の違いとみられ、確認中。
  - 対象は一般・療養病床を持つ病院（病棟票の許可病床が0の病院を除く）。有床診療所は含まない。
  - 患者が構想区域をまたいで在宅医療を受ける流出入は反映しない。
  - 病院名を伏せているが、値は公表データから計算できるため、匿名化ではない。照合のための番号の付け方や、手元で病院名つきの表を出す方法は、作成者と検討中。

alternatives:
  - id: zaitaku_renkei_psc_koso
