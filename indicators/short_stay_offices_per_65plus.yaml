id: short_stay_offices_per_65plus
version: 0.1.0
status: draft
name: 65歳以上人口1万人あたり短期入所生活介護事業所数
short_description: 在宅介護を続けるための短期入所（ショートステイ）の拠点の多さを、市区町村ごとに同じ方法で比べる入口の指標
unit_of_analysis: municipality
unit_note: >
  政令指定都市は市単位に集約する（介護保険の保険者が市であり、介護保険事業計画も市単位で立てるため）。
  区単位で見たいときは --ward-level で出力できる。

numerator:
  description: 短期入所生活介護事業所数（事業所番号で重複を除いた件数。特別養護老人ホームに併設のものや単独のものを含む）
  dataset: kaigo_jigyosho_210
  as_of: 2026年6月末
denominator:
  description: 65歳以上人口（総計＝日本人住民＋外国人住民）
  dataset: population_jumin_r8
  as_of: 2026年1月1日
formula: 短期入所生活介護事業所数 ÷ 65歳以上人口 × 10,000

intent: >
  在宅で介護を続ける家族の休息（レスパイト）や、退院直後・急な事情で一時的に自宅での生活が難しいときの受け皿になる、
  短期入所生活介護（ショートステイ）の拠点の分布を比べるための入口の指標。地域医療構想策定ガイドラインは、高齢者救急の増加に伴い、
  退院後の受け皿として介護保険施設や居宅サービスを適切に活用できる体制の整備を求めている。まず「拠点が少ない地域」を見つける目的で作った。

why_this_denominator: >
  他の介護サービスの指標と分母を揃えた。利用者は要介護の高齢者が中心なので、要介護認定者数を分母にした版も考えられる。

interpretation: >
  値が大きいほど、65歳以上人口に対して短期入所生活介護の事業所が多い。受け入れられるベッドの数は反映しない（「定員」列は使えない）。
  人口の少ない町村では1事業所の差で値が大きく変わる。

policy_questions:
  - 家族の介護負担を軽くし、在宅での介護を続けるための短期入所の拠点が少ない市区町村はどこか
  - 退院直後に一時的に受け入れられる介護側の資源が、地域でどれくらいあるか

caveats:
  - 医療的な管理が必要な人を介護老人保健施設・介護医療院などで受け入れる短期入所療養介護（別のサービス）は含まない。
  - 特別養護老人ホームの空きベッドを使う短期入所（空床利用型）も、事業所としては同じように1件と数えられるため、専用のベッドの数とは対応しない。
  - 事業所数であり、職員数・利用定員・提供回数などの供給量は反映しない。「定員」列は0や空欄が多く、桁の大きすぎる値もあるため、供給量の代わりには使えない。
  - 事業所の所在市区町村で数えている（公表ページの注記では「事業所所在地の市町村コード」）。市区町村の境界を越えた利用は反映しない。
  - 介護サービス情報公表システムに載っている事業所だけを数える。休止中の事業所が含まれるかどうかは未確認。
  - 分子（2026年6月末）と分母（2026年1月1日）の時点がずれている。
  - 市町村合併をまたぐ年の比較では、reference/ の対応表で現在のコードに揃える。

alternatives:
  - id: day_service_offices_per_65plus
    reason: 通いの拠点と並べて、在宅介護を支えるサービスを比べる
  - id: homecare_offices_per_65plus
    reason: 訪問介護の拠点と並べて見る

authors:
  - name: H.I.

script: indicators/short_stay_offices_per_65plus.py

output:
  area_code: municipality_code5
  area_name: municipality_name
  value: offices_per_10k_65plus
  numerator: offices
  denominator: pop_65plus
  scale: 10000
  digits: 3
  unit: 事業所／65歳以上人口1万人
  columns:
    - {name: municipality_code5, label: 市区町村コード}
    - {name: municipality_name, label: 市区町村名}
    - {name: offices, label: 短期入所生活介護事業所数, unit: 事業所}
    - {name: pop_65plus, label: 65歳以上人口, unit: 人}
    - {name: offices_per_10k_65plus, label: 65歳以上人口1万人あたり事業所数, unit: 事業所／1万人}

