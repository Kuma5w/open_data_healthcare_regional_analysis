id: recovery_bed_share_koso
version: 0.1.0
status: draft
name: 構想区域ごとの回復期病床の割合（休棟中を除く許可病床数に占める割合）
short_description: 病床機能報告で回復期と報告された病床が、区域の病床全体の何％かを構想区域ごとに比べる指標
unit_of_analysis: koso_kuiki
unit_note: 病棟票の構想区域コード（医療機関が報告したもの）で集計する。
numerator:
  description: 2025年7月1日時点の医療機能を「回復期」と報告した病棟の許可病床数（一般病床 w019 ＋ 療養病床 w023）
  dataset: bed_function_report_r7_ward
  as_of: 2025年7月1日
denominator:
  description: 高度急性期・急性期・回復期・慢性期と報告した病棟の許可病床数の合計（休棟中の病棟を除く）
  dataset: bed_function_report_r7_ward
  as_of: 2025年7月1日
formula: 回復期の許可病床数 ÷ 4機能の許可病床数の合計 × 100（％）
intent: 地域医療構想で長く議論されてきた「回復期の不足」が、構想区域によってどれくらい違うかを同じ方法で比べるための入口の指標。病床機能報告上の機能の構成を見るもので、実際に提供されている医療や必要な量そのものではない。必要病床数の構成比と並べて、差の大きい区域を議論の出発点にすることを想定している。
why_this_denominator: 休棟中の病床を分母に含めると、休棟が多い区域ほど割合が低く出るため除いた。許可病床数を使ったのは、必須項目で欠損がなく区域間で比べやすいため。実際に使われている病床で見たい場合は、最大使用病床数（w020・w024）を使う別の指標が考えられる。
interpretation: 割合が低い区域は、回復期として報告された病床が少ない。ただし急性期や慢性期と報告された病棟でも回復期の医療が提供されている場合があり、割合が低いことから直ちに「回復期の医療が不足している」とは言えない。病床の少ない区域では、1病棟の機能の変更で割合が大きく変わる。
policy_questions:
- 必要病床数の構成と比べて、回復期と報告された病床が少ない構想区域はどこか
- 定量的な基準で補正すると、区域の順位はどう変わるか
caveats:
- 医療機能は、定性的な基準を参考に各医療機関が病棟ごとに1つ選んで報告したもの。実際の病棟には様々な病期の患者が入院している。
- 回復期機能は回復期リハビリテーション病棟や地域包括ケア病棟に限られるという誤解などから、主に回復期の医療を担う病棟が急性期と報告されている例があると、厚生労働省の通知（平成30年8月16日）で指摘されている。都道府県によっては定量的な基準で補正している。
- 有床診療所の病床は含まない（診療所票は医療機能を診療所単位で報告しており、病棟票と単位が違う）。
- 構想区域は、病床機能報告に医療機関が報告した構想区域コードによる（令和7年度の構想区域マスタ）。
- 令和8年度以降の報告では回復期機能が「包括期機能」に見直されるため、年度をまたぐ比較では定義の違いに注意する。
- 都道府県が個別に報告内容を更新している場合があり、都道府県の公表値と一致しないことがある。
- 許可病床数で数えており、実際に稼働している病床数とは異なる。
alternatives:
- id: recovery_beds_per_100k_75plus_koso
  reason: 割合ではなく、75歳以上人口あたりの回復期病床の量で比べる
- id: recovery_share_max_used_koso
  reason: 許可病床数の代わりに最大使用病床数で数え、実際に使われている病床で見る
- id: recovery_share_quantitative_koso
  reason: 都道府県の定量的な基準で、急性期と報告された病棟の一部を回復期相当として数え直す
authors:
- name: H.I.
