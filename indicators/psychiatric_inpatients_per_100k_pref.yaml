output:
  area_code: pref_code
  area_name: pref_name
  value: inpatients_per_100k
  numerator: inpatients
  denominator: population
  scale: 100000
  digits: 1
  unit: 人／人口10万人
  columns:
    - {name: pref_code, label: 都道府県コード}
    - {name: pref_name, label: 都道府県名}
    - {name: inpatients, label: 在院患者数, unit: 人}
