  - {name: beds_acute, label: 急性期の許可病床数, unit: 床}
  - {name: beds_recovery, label: 回復期の許可病床数, unit: 床}
  - {name: beds_chronic, label: 慢性期の許可病床数, unit: 床}
  - {name: beds_active, label: 4機能の許可病床数の合計（休棟を除く）, unit: 床}
  - {name: beds_closed, label: 休棟中の許可病床数, unit: 床}
  - {name: recovery_share_pct, label: 回復期の割合, unit: ％}
