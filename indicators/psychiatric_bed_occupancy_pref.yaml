    - {name: inpatients_public, label: 在院患者 国立・都道府県立精神科病院等, unit: 人}
    - {name: beds_designated, label: 許可病床 指定病院, unit: 床}
    - {name: inpatients_designated, label: 在院患者 指定病院, unit: 人}
    - {name: beds_nondesignated, label: 許可病床 非指定病院, unit: 床}
    - {name: inpatients_nondesignated, label: 在院患者 非指定病院, unit: 人}
    - {name: occupancy_pct, label: 精神病床の利用率, unit: ％}
    - {name: occupancy_public_pct, label: 利用率 国立・都道府県立精神科病院等, unit: ％}
    - {name: occupancy_designated_pct, label: 利用率 指定病院, unit: ％}
