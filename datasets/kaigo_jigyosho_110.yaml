notes:
- サービス種類ごとに別ファイル（訪問介護はサービスコード110）。他のサービスは同じ形式で datasets/ に追加できる。
- 2024年6月末以前はZIP形式で提供されている。
- 政令指定都市は区単位のコードで収録されている。市単位で集計するときは chiiki_od.codes.ward_to_city を使う。
- 緯度・経度が0の事業所が35件ある（未設定とみられる）。地図に載せるときは除く。
