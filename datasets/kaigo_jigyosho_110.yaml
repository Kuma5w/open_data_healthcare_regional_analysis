publisher: 厚生労働省（介護サービス情報公表システム）
source_page: https://www.mhlw.go.jp/stf/kaigo-kouhyou_opendata.html
license:
  terms_url: https://www.mhlw.go.jp/chosakuken/index.html
  attribution: 出典：厚生労働省「介護サービス情報公表システム」オープンデータ（訪問介護、2026年6月末時点）を加工して作成
  notes: 介護サービス情報公表システムから抽出したデータであることを表示する。利用した場合は厚労省のフォームでの連絡が依頼されている。
update_frequency: 年2回（6月末時点・12月末時点）
verified: true
verified_note: 2026-11-26に2026年6月末時点ファイル（35,166行×24列、UTF-8 BOM付き）で確認。事業所番号に重複なし、1,776の市区町村コード。
files:
- key: main
  url: https://www.mhlw.go.jp/content/12300000/jigyosho_110_all_20260709180319.csv
  as_of: 2026年6月末
  format: csv
  encoding: utf-8-sig
columns:
- source: 都道府県コード又は市町村コード
  name: municipality_code
  type: str
  description: 事業所所在地の市町村コード（公表ページの注記による）。6桁（検査数字付き）。政令市は区のコード
- source: 'No'
  name: record_no
  type: str
  description: 介護保険事業所番号（公表ページの注記による。事業所番号の列と同じ値）
- source: 都道府県名
  name: pref_name
  type: str
- source: 市区町村名
  name: municipality_name
  type: str
- source: 事業所名
  name: office_name
  type: str
- source: 事業所名カナ
  name: office_name_kana
  type: str
- source: サービスの種類
  name: service_type
  type: str
- source: 住所
  name: address
  type: str
- source: 方書（ビル名等）
  name: address_building
  type: str
- source: 緯度
  name: lat
  type: float
- source: 経度
  name: lon
  type: float
