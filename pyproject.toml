[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chiiki-od"
version = "0.1.0"
description = "地域医療構想の分析に使うオープンデータの変換・指標計算・指標カード管理"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pyyaml>=6",
  "jsonschema>=4.18",
  "python-calamine>=0.2",
]

[project.urls]
Repository = "https://github.com/Kuma5w/open_data_healthcare_regional_analysis"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "openpyxl>=3.1"]

[project.scripts]
chiiki-od = "chiiki_od.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chiiki_od"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 日本語のメッセージ文は長くなりやすいため、行の長さは警告しない
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
