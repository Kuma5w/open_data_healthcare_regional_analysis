id: recovery_beds_per_100k_75plus_koso
version: 0.1.0
status: draft
name: 構想区域ごとの75歳以上人口10万人あたり回復期病床数
short_description: 回復期と報告された病床の量を、75歳以上人口に対して構想区域ごとに比べる指標
unit_of_analysis: koso_kuiki
unit_note: 病床は病棟票の構想区域コードで、人口は reference/koso_kuiki.csv で市区町村（政令市は区）から構想区域に集計する。
numerator:
  description: 2025年7月1日時点の医療機能を「回復期」と報告した病棟の許可病床数（一般病床 w019 ＋ 療養病床 w023）
  dataset: bed_function_report_r7_ward
  as_of: 2025年7月1日
denominator:
  description: 75歳以上人口（総計＝日本人住民＋外国人住民）。市区町村と政令市の区の行を構想区域ごとに合計
  dataset: population_jumin_r7
  as_of: 2025年1月1日
formula: 回復期の許可病床数 ÷ 75歳以上人口 × 100,000
intent: 回復期の病床の量を、需要の中心になる高齢者の人口に対して構想区域ごとに比べるための指標。回復期の割合（recovery_bed_share_koso）だけでは、区域全体の病床が多いのか少ないのかが分からないため、人口あたりの量で補う。
why_this_denominator: 回復期の入院（大腿骨骨折や脳卒中の後のリハビリ、高齢者の急性疾患の後の在宅復帰支援など）は75歳以上に多く、2040年に向けた新たな地域医療構想でも高齢者救急と在宅復帰支援が需要の中心になるため、75歳以上人口を選んだ。総人口を分母にすると、若い人口の多い都市部で値が小さく出る。65歳以上を分母にした版は別の指標として並べられる。
interpretation: 値が大きいほど、75歳以上人口に対して回復期と報告された病床が多い。患者が構想区域をまたいで入院する流出入は反映しないため、隣接する区域と合わせて見る。
policy_questions:
- 高齢者人口に対して回復期の病床が少ない構想区域はどこか
- 回復期の割合が低い区域は、人口あたりの量でも少ないのか
caveats:
- 医療機能は、定性的な基準を参考に各医療機関が病棟ごとに1つ選んで報告したもの。実際の病棟には様々な病期の患者が入院している。
- 回復期機能は回復期リハビリテーション病棟や地域包括ケア病棟に限られるという誤解などから、主に回復期の医療を担う病棟が急性期と報告されている例があると、厚生労働省の通知（平成30年8月16日）で指摘されている。都道府県によっては定量的な基準で補正している。
- 有床診療所の病床は含まない（診療所票は医療機能を診療所単位で報告しており、病棟票と単位が違う）。
- 構想区域は、病床機能報告に医療機関が報告した構想区域コードによる（令和7年度の構想区域マスタ）。
- 令和8年度以降の報告では回復期機能が「包括期機能」に見直されるため、年度をまたぐ比較では定義の違いに注意する。
- 都道府県が個別に報告内容を更新している場合があり、都道府県の公表値と一致しないことがある。
- 患者の構想区域間の流出入を反映しない。
- 分子（2025年7月1日）と分母（2025年1月1日）の時点が半年ずれている。
- 外国人住民が少ない市区町村では外国人住民の年齢内訳が非公表のため、75歳以上人口がわずかに少なく数えられる（人口データの age_sum_gap）。
- 北方領土の6村は人口0で構想区域の対応表にないため、集計から除外される（影響なし）。
alternatives:
- id: recovery_bed_share_koso
  reason: 人口ではなく、区域の病床全体に占める割合で比べる
- id: recovery_beds_per_100k_65plus_koso
  reason: 65歳以上人口を分母にし、他の高齢者向け指標と分母を揃える
