notes:
- 医療機関ごとの値はない。都道府県（政令指定都市の分を含む）と政令指定都市ごとの集計表で、変換後は1行＝表×地域。
- 施設概要1〜8は精神病床を有する病院（1が全体）、9〜11は精神病床を有しない医療機関（病床・入院の列は空欄）。
- 精神病床を有しない医療機関は回答率が都道府県で約20〜100％と違う（data/processed/<output>__response_rate.parquet）。都道府県どうしの比較には使わない。
- 記号「-」（相談員がいないため1人当たりの値を計算できないなど）は欠損にした。
- 人数の「非常勤」は精神科への勤務が週1日以上の職員数。精神科医師は、業務の半分以上がICD-10のFコードの疾患の診療なら、心療内科など他科の所属でも数える。
