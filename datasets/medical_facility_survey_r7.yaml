notes:
- e-Stat の「医療施設調査」から、令和7年（動態調査）の二次医療圏・市区町村編 第1表（病院数・病床数）と第2表（一般診療所数・歯科診療所数・病床数）を CSV でダウンロードして使う（ファイル名 n0001.csv・n0002.csv）。
- 表の記号「-」は計数がない（0）。
- 表には都道府県・二次医療圏・市区町村の3段の行がある。変換後は市区町村の行だけを残し、二次医療圏は列にした。政令市は区の行だけで、市の合計行はない。
- 医師数・歯科医師数・薬剤師数はこの表にない（医師・歯科医師・薬剤師統計）。病院の従事者数は3年ごとの静態調査にある。
