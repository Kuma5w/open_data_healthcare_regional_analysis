<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地域医療構想 指標カタログ</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 研究者どうしの資料室。落ち着いて正確、出典と注意点を必ず添える
   IDEA: 建築の作品集のような指標カード台帳。各指標は図面1枚、注記が欄外に付く
   PICTURE: 一覧と詳細そのもの。右に質問窓口（チャット）
   COLOUR and TYPE: 白・黒・コンクリート灰、意図の欄だけ安全黄色。BIZ UDPゴシック＋Hanken Grotesk
   LAYOUT: 左に台帳（一覧→詳細）、右にチャット。900px未満は縦に積む */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a1a19);--ink:light-dark(#141414,#f1f1ec);--mut:light-dark(#5d5d58,#a9a9a2);--pl:light-dark(#ecece8,#262624);--pl2:light-dark(#d8d8d4,#34342f);--line:light-dark(#c9c9c3,#44443e);--y:#ffe600;--yi:#141414;--link:light-dark(#0b4fb3,#8cb8ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
a{color:var(--link)}main a,.src a{overflow-wrap:anywhere}button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.num,code{font-family:"Hanken Grotesk",ui-monospace,monospace}
code{font-size:.9em;background:var(--pl);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
pre{background:var(--pl);padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.55;border-left:3px solid var(--pl2)}
pre code{background:none;padding:0}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px) 56px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.2;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--mut);font-size:15px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{text-decoration:none;color:var(--ink);padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;border:1px solid transparent}
nav a[aria-current=page]{border-color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:32px;margin-top:24px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
h2{font-size:24px;line-height:1.3;margin:0 0 6px}
h3{font-size:17px;margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.tools input{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;font-size:16px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.list a.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 4px;text-decoration:none;color:var(--ink)}
.list a.row:hover{background:var(--pl)}
.row .t{font-weight:700;font-size:17px;line-height:1.45}
.row .d{grid-column:1/-1;color:var(--mut);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;justify-content:flex-end}
.b{font-size:13px;border:1px solid var(--line);padding:1px 8px;white-space:nowrap}
.b.draft{border-style:dashed}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font-size:14px;margin:4px 0 0}
.formula{background:var(--pl);padding:14px 16px;font-weight:700;margin:16px 0 0}
.intent{background:var(--y);color:var(--yi);padding:16px 18px;margin:18px 0 0}
.intent h3{border:0;margin:0 0 6px;padding:0;color:var(--yi)}
.intent p{margin:0}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--pl);white-space:nowrap}
ul.c{margin:6px 0;padding-left:1.2em}ul.c li{margin:4px 0}
.btn{background:var(--ink);color:var(--bg);border:0;padding:0 16px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.back{display:inline-block;margin-bottom:10px;font-size:14px}
.cols{max-height:420px;overflow:auto;border:1px solid var(--line)}
.cols table{margin:0;font-size:14px}
.note{font-size:14px;color:var(--mut)}
td.num{white-space:nowrap}
/* chat */
.chat{position:sticky;top:16px;border:2px solid var(--ink);display:flex;flex-direction:column;max-height:calc(100vh - 32px);background:var(--bg)}
@media(max-width:900px){.chat{position:static;max-height:none}}
.chat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat-h b{font-size:16px}
.focus{font-size:13px;color:var(--mut);padding:6px 14px 0}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.m{overflow-wrap:anywhere;font-size:15px}
.m.u{align-self:flex-end;background:var(--pl);padding:8px 12px;max-width:88%;white-space:pre-wrap}
.m.a{border-left:3px solid var(--ink);padding-left:12px}
.m.a p{margin:0 0 .6em}.m.a ul{margin:0 0 .6em;padding-left:1.2em}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.src a{font-size:12px;border:1px solid var(--line);padding:2px 8px;text-decoration:none}
.sug{display:flex;flex-direction:column;gap:6px}
.sug button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;min-height:44px;cursor:pointer;font-size:14px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat textarea{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 10px;min-height:48px;resize:vertical;font-size:16px}
.send{background:var(--y);color:var(--yi);border:0;font-weight:700;padding:0 16px;min-height:48px;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.st{font-size:12px;color:var(--mut);padding:0 14px 10px}
dialog{border:2px solid var(--ink);background:var(--bg);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgb(0 0 0/.35)}
dialog label{display:block;font-size:14px;margin:12px 0 4px}
dialog input,dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;font-size:16px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.presets button{font-size:13px;min-height:36px}
.dots::after{content:"…";animation:d 1s steps(3) infinite}
@keyframes d{0%{content:"."}50%{content:".."}100%{content:"..."}}
@media(prefers-reduced-motion:reduce){.dots::after{animation:none}}
@media(max-width:600px){h2{font-size:21px}th,td{padding:6px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:6.5em}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:var(--mut);font-size:13px}}
/* 結果を見る（ボタン出力）。棒の色は1系列なので1色（dataviz の slot 1、明暗それぞれ背景に対して検証済み） */
:root{--s1:light-dark(#257de0,#338ced);--grid:light-dark(#e7e7e7,#303030)}
.res{margin-top:28px;border:2px solid var(--ink);padding:4px 18px 18px}
.res>h3:first-child{border:0;margin-top:12px;padding-top:0;font-size:20px}
.res-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:12px 0 16px}
.res-tools label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
.res-tools select{min-height:44px;padding:0 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;min-width:11em}
.warn{border-left:4px solid var(--ink);background:var(--pl);padding:10px 14px;margin:10px 0;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 6px}
.kpi{background:var(--bg);padding:10px 14px}
.kpi .l{font-size:13px;color:var(--mut);line-height:1.4}
.kpi .v{font:700 26px/1.25 "Hanken Grotesk",sans-serif;overflow-wrap:anywhere}
.kpi .u{font-size:12px;color:var(--mut);line-height:1.4}
.ch{margin:18px 0 6px;font-weight:700;font-size:15px}
.bars{margin:0 0 4px}
.br{display:grid;grid-template-columns:minmax(4.5em,9em) minmax(0,1fr) 5.2em;align-items:center;gap:0 10px;width:100%;min-height:24px;padding:0 4px;margin:0;border:0;background:none;color:var(--ink);font-size:14px;line-height:1.3;text-align:left}
button.br{cursor:pointer}
.br:not(.hd):hover,.br:focus-visible{background:var(--pl)}
.br .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tk{position:relative;align-self:stretch;min-height:24px}
.br .bar{position:absolute;left:0;top:6px;height:12px;background:var(--s1);border-radius:0 4px 4px 0;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.br .ref{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink)}
.br .v{text-align:right;font-family:"Hanken Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.br.hd .rl{position:absolute;bottom:2px;white-space:nowrap;font-size:13px;color:var(--mut)}
.br.hd .rl b{color:var(--ink);font-family:"Hanken Grotesk",sans-serif}
.bars .gap{font-size:13px;color:var(--mut);padding:6px 4px 6px calc(min(9em,30%) + 14px);border-block:1px solid var(--grid)}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgb(0 0 0/.18);padding:8px 10px;font-size:13px;line-height:1.5;max-width:280px}
.tip b{display:block;font:700 16px/1.3 "Hanken Grotesk",sans-serif}
.tip .s{color:var(--mut)}
.tw{overflow-x:auto;margin-top:6px}
.rt{font-size:14px;width:auto;min-width:100%}.rt th{white-space:normal;vertical-align:bottom;font-size:13px;line-height:1.4;padding:6px 8px;min-width:4.5em}.rt td{padding:5px 8px;white-space:nowrap}.rt td.hash{white-space:normal;min-width:18em}.rt td.num,.rt th.num{text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
details.rd{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
details.rd summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.hash{font-family:"Hanken Grotesk",ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}
.print-only{display:none}
@media(max-width:600px){.res{padding:4px 12px 14px}.br{grid-template-columns:minmax(4em,6.5em) minmax(0,1fr) 4.6em;gap:0 6px}.bars .gap{padding-left:4px}}
@media print{
  body{font-size:11pt}.wrap{max-width:none;padding:0}
  nav,.chat,.back,.res-tools,.actions,#ask-card,.tip,.np,details.rd:not(.pr){display:none!important}
  .grid{display:block;margin-top:12px}header{padding-bottom:8px}
  .res{border-width:1px;break-inside:auto}.br,.rt tr{break-inside:avoid}
  .intent{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  details.rd summary{min-height:0}.print-only{display:block}
  a{color:inherit}
}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>地域医療構想 オープンデータ指標カタログ</h1>
    <p class="sub">指標ごとに、作成者の意図・計算方法・注意点を確認できます。右の窓口では、指標カードとデータの説明を根拠に質問に答えます。</p>
  </div>
  <nav aria-label="ページ">
    <a href="#indicators" data-nav="indicators">指標</a>
    <a href="#datasets" data-nav="datasets">データ</a>
    <a href="#references" data-nav="references">対応表</a>
    <a href="#about" data-nav="about">このサイトについて</a>
  </nav>
</header>

<div class="grid">
  <main id="view" aria-live="polite"><p class="note">読み込み中です…</p></main>

  <aside class="chat" aria-label="質問窓口">
    <div class="chat-h"><b>質問する</b><button class="btn ghost" type="button" id="open-settings">接続の設定</button></div>
    <div class="focus" id="focus"></div>
    <div class="log" id="log"><div class="sug" id="sug"></div></div>
    <form id="f">
      <textarea id="q" rows="2" aria-label="質問" placeholder="例：回復期の割合で休棟中の病床を除いたのはなぜ？"></textarea>
      <button class="send" id="send" type="submit">送信</button>
    </form>
    <div class="st" id="st">準備しています…</div>
  </aside>
</div>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 style="font-size:20px">接続の設定</h2>
    <p class="note">回答を作るAIを選びます。APIキーはこのブラウザの中にだけ保存され、ほかには送られません（接続先のAIには送られます）。</p>
    <label for="prov">接続先</label>
    <select id="prov">
      <option value="claude">Claude（claude.ai 上で開いているとき）</option>
      <option value="openai">OpenAI互換API（ローカルのQwenなど）</option>
    </select>
    <div id="oa">
      <label for="base">ベースURL</label>
      <input id="base" placeholder="http://localhost:11434/v1">
      <div class="presets">
        <button type="button" class="chip" data-base="http://localhost:11434/v1">Ollama</button>
        <button type="button" class="chip" data-base="http://localhost:1234/v1">LM Studio</button>
        <button type="button" class="chip" data-base="http://localhost:8080/v1">llama.cpp</button>
      </div>
      <label for="model">モデル名</label>
      <input id="model" placeholder="例：qwen3.8:27b">
      <label for="key">APIキー（ローカルなら空欄）</label>
      <input id="key" type="password" autocomplete="off">
      <p class="note">ローカルのOllamaを使う場合は、Ollama側でこのサイトのアドレスからの接続を許可する必要があります（docs/site.md）。</p>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" value="cancel" type="submit">閉じる</button>
      <button class="btn" value="save" type="submit" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
{
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const UNIT = { municipality: "市区町村", koso_kuiki: "構想区域", secondary_medical_area: "二次医療圏", prefecture: "都道府県", designated_city_ward: "政令市の区", facility: "医療機関", ward_unit: "病棟" };
const STATUS = { draft: "草案", reviewed: "レビュー済み", deprecated: "廃止" };
let CAT = null, IDX = [], REPO = "";
const toHash = (id) => id.replace(/_/g, "-");
const fromHash = (h, list) => list.find((x) => toHash(x.id) === h);
const gh = (path) => `${REPO}/blob/main/${path}`;
const safeUrl = (u) => (/^https?:\/\//.test(u || "") ? u : null);

// ---- 簡易Markdown（docs の節の表示用） -------------------------------------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
}
function md(text) {
  const lines = String(text).split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { let code = []; i++; while (i < lines.length && !lines[i].startsWith("```")) code.push(lines[i++]); i++; out += `<pre><code>${esc(code.join("\n"))}</code></pre>`; continue; }
    if (l.trim().startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r, k) => k !== 1 || !/^\s*\|?\s*:?-/.test(r));
      out += `<table class="stack"><thead><tr>${cells(body[0]).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      continue;
    }
    if (/^\s*[-*] /.test(l)) { let items = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*] /, "")); out += `<ul class="c">${items.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { let items = []; while (i < lines.length && /^\d+\. /.test(lines[i])) items.push(lines[i++].replace(/^\d+\. /, "")); out += `<ol>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</ol>`; continue; }
    if (/^#{2,4} /.test(l)) { out += `<h4>${inline(l.replace(/^#+ /, ""))}</h4>`; i++; continue; }
    if (l.startsWith("> ")) { out += `<p class="note">${inline(l.slice(2))}</p>`; i++; continue; }
    if (l.trim()) out += `<p>${inline(l)}</p>`;
    i++;
  }
  return out;
}

// ---- 画面 -----------------------------------------------------------------
let unitFilter = "", query = "";
function setNav(name) {
  document.querySelectorAll("[data-nav]").forEach((a) => (a.dataset.nav === name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
}
function cardText(c) { return [c.name, c.short_description, c.intent, c.why_this_denominator, c.interpretation, ...(c.caveats || []), c.numerator?.description, c.denominator?.description].join(" "); }

function viewIndicators() {
  setNav("indicators");
  const units = [...new Set(CAT.indicators.map((c) => c.unit_of_analysis))];
  const list = CAT.indicators.filter((c) => (!unitFilter || c.unit_of_analysis === unitFilter) && (!query || cardText(c).includes(query)));
  $("view").innerHTML = `<h2>指標</h2><p class="note">${CAT.indicators.length}件。草案の指標は、作成者の確認前の内容を含みます。</p>
  <div class="tools"><input id="iq" type="search" placeholder="指標を探す（例：回復期、訪問介護）" value="${esc(query)}" aria-label="指標を探す">
  <button class="chip" type="button" data-unit="" aria-pressed="${!unitFilter}">すべて</button>${units.map((u) => `<button class="chip" type="button" data-unit="${esc(u)}" aria-pressed="${unitFilter === u}">${esc(UNIT[u] || u)}</button>`).join("")}</div>
  <ul class="list">${list.map((c) => `<li><a class="row" href="#ind-${toHash(c.id)}"><span class="t">${esc(c.name)}</span>
  <span class="badges">${CAT.results?.[c.id] ? `<span class="b">結果あり</span>` : ""}<span class="b">${esc(UNIT[c.unit_of_analysis] || c.unit_of_analysis)}</span><span class="b ${c.status === "draft" ? "draft" : ""}">${esc(STATUS[c.status] || c.status)}</span></span>
  <span class="d">${esc(c.short_description || "")}</span></a></li>`).join("") || `<li class="note" style="padding:14px 4px">該当する指標はありません。</li>`}</ul>`;
  $("iq").addEventListener("input", (e) => { query = e.target.value.trim(); const pos = e.target.selectionStart; viewIndicators(); const el = $("iq"); el.focus(); el.setSelectionRange(pos, pos); });
  document.querySelectorAll("[data-unit]").forEach((b) => b.addEventListener("click", () => { unitFilter = b.dataset.unit; viewIndicators(); }));
}

function term(t) {
  const ds = CAT.datasets.find((d) => d.id === t.dataset);
  return `<td>${esc(t.description)}</td><td>${ds ? `<a href="#ds-${toHash(ds.id)}">${esc(ds.title)}</a>` : esc(t.dataset)}</td><td class="num">${esc(t.as_of || "")}</td>`;
}
function viewIndicator(c, params) {
  setNav("indicators");
  const alt = (c.alternatives || []).map((a) => { const t = CAT.indicators.find((x) => x.id === a.id); return `<li>${t ? `<a href="#ind-${toHash(t.id)}">${esc(t.name)}</a>` : `<code>${esc(a.id)}</code>（未作成）`}：${esc(a.reason)}</li>`; }).join("");
  const refs = (c.references || []).map((r) => `<li>${safeUrl(r.url) ? `<a href="${esc(r.url)}">${esc(r.title)}</a>` : esc(r.title)}</li>`).join("");
  $("view").innerHTML = `<a class="back" href="#indicators">← 指標の一覧</a>
  <h2>${esc(c.name)}</h2>
  <div class="meta"><span>単位：${esc(UNIT[c.unit_of_analysis] || c.unit_of_analysis)}</span><span>状態：${esc(STATUS[c.status] || c.status)}</span><span class="num">v${esc(c.version)}</span><span>作成者：${esc((c.authors || []).map((a) => a.name).join("、"))}</span></div>
  <div class="formula">${esc(c.formula)}</div>
  <div class="intent"><h3>この指標の意図</h3><p>${esc(c.intent)}</p></div>
  <section class="res" id="res" aria-labelledby="res-h"><h3 id="res-h">結果を見る</h3><p class="note">結果を読み込んでいます…</p></section>
  <h3>分子と分母</h3>
  <table class="stack"><thead><tr><th></th><th>内容</th><th>データ</th><th>時点</th></tr></thead><tbody>
  <tr><th>分子</th>${term(c.numerator)}</tr><tr><th>分母</th>${term(c.denominator)}</tr></tbody></table>
  ${c.unit_note ? `<p class="note">${esc(c.unit_note)}</p>` : ""}
  <h3>なぜこの分母か</h3><p>${esc(c.why_this_denominator)}</p>
  ${c.interpretation ? `<h3>読み方</h3><p>${esc(c.interpretation)}</p>` : ""}
  ${(c.policy_questions || []).length ? `<h3>この指標で考えたい問い</h3><ul class="c">${c.policy_questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}
  <h3 id="caveats">注意点</h3><ul class="c">${(c.caveats || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
  ${alt ? `<h3>関連する指標</h3><ul class="c">${alt}</ul>` : ""}
  <h3>計算と出典</h3><ul class="c"><li><a href="${gh(c.script)}">計算スクリプト（${esc(c.script)}）</a></li><li><a href="${gh(`indicators/${c.id}.yaml`)}">指標カード（YAML）</a></li>${refs}</ul>
  <p style="margin-top:20px"><button class="btn" type="button" id="ask-card">この指標について質問する</button></p>`;
  $("ask-card").addEventListener("click", () => setFocus(c.id, true));
  loadResult(c, params || new URLSearchParams());
}

// ---- 結果を見る（ボタン出力） -----------------------------------------------
// 数値は Python（指標スクリプトの compute と chiiki_od.results）が作ったものだけを表示する。
// ここで行うのは、絞り込み・並べ替え・表示・ダウンロードだけ。新しい数値は計算しない。
const RES = {};   // 指標id → 結果のJSON
let RS = null;    // 表示中の結果 { c, doc, meta, pref, sort }
let resToken = 0;
const SORTS = { desc: "値の大きい順", asc: "値の小さい順", code: "コード順" };
const fmt = (v, d) => (v === null || v === undefined || Number.isNaN(+v) ? "—" : Number(v).toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d }));
const fmtCell = (col, v, d) => (v === null || v === undefined ? "—" : col.type === "string" ? v : fmt(v, col.type === "integer" ? 0 : d));
const colHead = (col) => col.label + (col.unit ? `（${col.unit}）` : "");

async function loadResult(c, params) {
  const token = ++resToken;
  const el = $("res"); if (!el) return;
  const meta = CAT.results?.[c.id];
  if (!meta) {
    el.innerHTML = `<h3 id="res-h">結果を見る</h3><p class="note">この指標の計算結果は、まだサイトに載っていません。手元で <code>chiiki-od run ${esc(c.id)}</code> を実行すると計算できます（<a href="${gh("docs/site.md")}">サイトに載せる手順</a>）。</p>`;
    return;
  }
  try {
    RES[c.id] ||= await fetch(meta.path).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (_) {
    if (token === resToken) el.innerHTML = `<h3 id="res-h">結果を見る</h3><p class="note">結果のファイル（${esc(meta.path)}）を読み込めませんでした。</p>`;
    return;
  }
  if (token !== resToken || !$("res")) return;
  const doc = RES[c.id], pref = params.get("pref") || "", sort = params.get("sort") || "desc";
  RS = { c, doc, meta, pref: doc.by_pref[pref] ? pref : "", sort: SORTS[sort] ? sort : "desc" };
  drawResult();
  renderSug();
}

// 表示に使う形に並べる（値の計算はしない）
function resultView() {
  const { c, doc, pref, sort } = RS;
  const o = doc.output, d = o.digits ?? 1;
  const ix = Object.fromEntries(doc.columns.map((x, i) => [x.name, i]));
  const V = ix[o.value], CODE = ix[o.area_code], NAME = ix[o.area_name];
  const NUM = o.numerator ? ix[o.numerator] : null, DEN = o.denominator ? ix[o.denominator] : null;
  const pooled = doc.national?.pooled != null;
  const unitWord = UNIT[c.unit_of_analysis] || "地域";
  const cmp = sort === "code" ? (a, b) => a.code.localeCompare(b.code)
    : (a, b) => (a.v === null) - (b.v === null) || (sort === "asc" ? a.v - b.v : b.v - a.v) || a.code.localeCompare(b.code);
  const items = pref
    ? doc.rows.filter((r) => r[CODE].slice(0, 2) === pref).map((r) => ({ code: r[CODE], name: r[NAME], v: r[V], r }))
    : Object.entries(doc.by_pref).map(([k, s]) => ({ code: k, name: s.name, v: pooled ? s.pooled : s.median, s }));
  items.sort(cmp);
  return { o, d, ix, V, CODE, NAME, NUM, DEN, pooled, unitWord, items,
    region: pref ? doc.by_pref[pref].name : "全国",
    ref: pooled ? doc.national.pooled : doc.summary.median, refLabel: pooled ? "全国計" : "全国の中央値" };
}

function barsHtml(v, clickable) {
  const { items, ref, refLabel, d } = v;
  const shown = items.map((x, i) => ({ ...x, i })).filter((x) => x.v !== null);
  const max = Math.max(...shown.map((x) => x.v), ref ?? 0) || 1;
  const pct = (x) => ((Math.max(0, x) / max) * 100).toFixed(3);
  let list = shown, cut = 0;
  if (shown.length > 60) { cut = shown.length - 50; list = [...shown.slice(0, 25), null, ...shown.slice(-25)]; }
  const refEl = ref != null ? `<span class="ref" style="left:${pct(ref)}%"></span>` : "";
  const rp = +pct(ref ?? 0);
  const head = ref != null
    ? `<div class="br hd" aria-hidden="true"><span></span><span class="tk"><span class="rl" style="${rp > 55 ? `right:calc(${(100 - rp).toFixed(3)}% + 6px)` : `left:calc(${rp}% + 6px)`}">${esc(refLabel)} <b>${fmt(ref, d)}</b></span>${refEl}</span><span></span></div>` : "";
  const tag = clickable ? "button" : "div";
  const row = (x) => (x === null
    ? `<div class="gap">中略（${cut.toLocaleString("ja-JP")}件）。すべての値は下の表にあります</div>`
    : `<${tag} ${clickable ? `type="button" aria-label="${esc(x.name)} ${fmt(x.v, d)}。この都道府県を表示"` : ""} class="br" data-i="${x.i}"><span class="n">${esc(x.name)}</span><span class="tk"><span class="bar" style="width:${pct(x.v)}%"></span>${refEl}</span><span class="v">${fmt(x.v, d)}</span></${tag}>`);
  const missing = items.length - shown.length;
  return `<div class="bars" id="bars">${head}${list.map(row).join("")}</div>${missing ? `<p class="note">値のない${esc(v.unitWord)} ${missing}件はグラフに含めていません（表には含めています）。</p>` : ""}`;
}

function tableHtml(v) {
  const { doc } = RS, { items, d } = v;
  if (RS.pref) {
    return `<div class="tw"><table class="rt"><thead><tr>${doc.columns.map((c) => `<th class="${c.type === "string" ? "" : "num"}">${esc(colHead(c))}</th>`).join("")}</tr></thead>
    <tbody>${items.map((x) => `<tr>${doc.columns.map((c, i) => `<td class="${c.type === "string" ? "" : "num"}">${esc(fmtCell(c, x.r[i], d))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  const num = v.NUM !== null ? doc.columns[v.NUM] : null, den = v.DEN !== null ? doc.columns[v.DEN] : null;
  const head = ["都道府県", `${v.unitWord}の数`, ...(num ? [`${colHead(num)}の合計`, `${colHead(den)}の合計`, "都道府県計"] : []), "中央値", "最小", "最大"];
  return `<div class="tw"><table class="rt"><thead><tr>${head.map((h, i) => `<th class="${i ? "num" : ""}">${esc(h)}</th>`).join("")}</tr></thead>
  <tbody>${items.map(({ s }) => `<tr><td>${esc(s.name)}</td><td class="num">${fmt(s.n, 0)}</td>${num ? `<td class="num">${fmtCell(num, s.numerator_sum, d)}</td><td class="num">${fmtCell(den, s.denominator_sum, d)}</td><td class="num">${fmt(s.pooled, d)}</td>` : ""}<td class="num">${fmt(s.median, d)}</td><td class="num">${fmt(s.min, d)}</td><td class="num">${fmt(s.max, d)}</td></tr>`).join("")}</tbody></table></div>`;
}

function reproHtml() {
  const { c, doc } = RS;
  const ins = Array.isArray(doc.inputs) ? doc.inputs : [];
  const lines = ["git clone " + REPO, "cd " + REPO.split("/").pop(), "pip install -e ."];
  for (const i of ins) lines.push(i.manual_download ? `chiiki-od fetch ${i.dataset} --from-dir <保存したフォルダ>` : `chiiki-od fetch ${i.dataset}`, `chiiki-od convert ${i.dataset}`);
  lines.push(`chiiki-od run ${c.id}`);
  const csvUrl = (CAT.pages_url || "") + doc.csv;
  const strCols = doc.columns.filter((x) => x.type === "string").map((x) => x.name);
  const py = `import pandas as pd\ndf = pd.read_csv(\n    "${csvUrl}",\n    dtype={${strCols.map((n) => `"${n}": str`).join(", ")}},\n)`;
  const r = `df <- readr::read_csv(\n  "${csvUrl}",\n  col_types = readr::cols(${strCols.map((n) => `${n} = "c"`).join(", ")})\n)`;
  const manual = ins.filter((i) => i.manual_download);
  const fileName = (f) => { const n = (f.url || "").split("/").pop() || ""; return /\.(xlsx?|zip|csv)$/i.test(n) ? n : "公表ページ"; };
  return `<details class="rd"><summary>同じ結果を手元で作る（再現の手順）</summary>
  <p>計算スクリプトと手順はすべて公開しています。元データ（公表ファイル）はリポジトリに含まれないため、各自で取得します。</p>
  <pre><code>${esc(lines.join("\n"))}</code></pre>
  ${manual.length ? `<p class="note">${manual.map((i) => `「${esc(i.title)}」は自動では取得できません。<a href="${esc(safeUrl(i.source_page) || "#")}">公表元のページ</a>から保存し、上の <code>--from-dir</code> で取り込みます。`).join("")}</p>` : ""}
  <p>結果は <code>data/outputs/${esc(c.id)}.csv</code> に出ます。サイトに載せる結果は <code>chiiki-od results ${esc(c.id)}</code> で作ります。</p>
  <h4>元データが同じか確かめる（SHA-256）</h4>
  <p class="note">取得したファイルのハッシュ値が次と一致すれば、このページと同じファイルから計算しています。</p>
  <div class="tw"><table class="rt"><thead><tr><th>ファイル</th><th>時点</th><th>SHA-256</th></tr></thead><tbody>
  ${ins.map((i) => `<tr><th colspan="3" style="text-align:left">${esc(i.title)}</th></tr>${i.files.map((f) => `<tr><td>${safeUrl(f.url) ? `<a href="${esc(f.url)}">${esc(fileName(f))}</a>` : esc(f.key)}</td><td>${esc(f.as_of || "")}</td><td class="hash">${esc(f.sha256 || "")}</td></tr>`).join("")}`).join("")}
  </tbody></table></div>
  <h4>公開している結果をそのまま読み込む</h4>
  <p class="note">列名は計算スクリプトのままです。コードの列は文字列として読み込みます（先頭の0を保つため）。</p>
  <pre><code>${esc(py)}</code></pre><pre><code>${esc(r)}</code></pre></details>`;
}

function recordHtml() {
  const { c, doc } = RS;
  const ins = Array.isArray(doc.inputs) ? doc.inputs : [];
  return `<details class="rd pr"><summary>計算の記録と出典</summary>
  <ul class="c"><li>計算日時：<span class="num">${esc(doc.generated_at)}</span>（指標カード v${esc(doc.card_version)}）</li>
  <li>計算スクリプト：<a href="${gh(doc.script)}">${esc(doc.script)}</a>（SHA-256 <span class="hash">${esc(doc.script_sha256.slice(0, 16))}…</span>）</li>
  ${(doc.notes || []).map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
  <p>${ins.map((i) => esc(i.attribution)).join("<br>")}</p></details>`;
}

function drawResult() {
  const el = $("res"); if (!el || !RS) return;
  const { c, doc, meta, pref } = RS;
  const v = resultView(), { d, o } = v;
  const s = pref ? doc.by_pref[pref] : doc.summary;
  const card = (l, val, u) => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v">${val}</div>${u ? `<div class="u">${esc(u)}</div>` : ""}</div>`;
  const kpis = [
    pref && v.pooled ? card(`${v.region}計`, fmt(s.pooled, d), o.unit) : "",
    card(v.refLabel, fmt(v.ref, d), o.unit),
    card(pref ? `${v.region}内の中央値` : `中央値（${v.unitWord}ごとの値）`, fmt(s.median, d), o.unit),
    card(`${v.unitWord}の数`, fmt(s.n, 0), s.n_missing ? `値のないもの ${s.n_missing}件` : ""),
  ].join("");
  const prefOpts = Object.entries(doc.by_pref).map(([k, p]) => `<option value="${k}" ${k === pref ? "selected" : ""}>${esc(p.name)}（${p.n}）</option>`).join("");
  const ds = (t) => CAT.datasets.find((x) => x.id === t.dataset)?.title || t.dataset;
  const same = c.numerator.dataset === c.denominator.dataset;
  const nRows = pref ? v.items.length : doc.rows.length;
  el.innerHTML = `<h3 id="res-h">結果を見る</h3>
  <p class="note">データ：${esc(ds(c.numerator))}（${esc(c.numerator.as_of || "")}）${same ? "" : `、${esc(ds(c.denominator))}（${esc(c.denominator.as_of || "")}）`}。計算日 <span class="num">${esc(doc.generated_at.slice(0, 10))}</span>。</p>
  ${meta.stale?.length ? `<div class="warn" role="note"><b>この結果は、いまの指標カードや計算スクリプトと食い違っている可能性があります。</b><br>${meta.stale.map(esc).join("。")}</div>` : ""}
  <div class="res-tools">
    <label>地域<select id="rp"><option value="">全国（都道府県ごと）</option>${prefOpts}</select></label>
    <label>並べ方<select id="rsort">${Object.entries(SORTS).map(([k, t]) => `<option value="${k}" ${k === RS.sort ? "selected" : ""}>${t}</option>`).join("")}</select></label>
  </div>
  <div class="kpis">${kpis}</div>
  <p class="note">「計」は、表の行の分子と分母をそれぞれ合計して計算した値です。中央値は${esc(v.unitWord)}ごとの値の中央値です。どちらも計算スクリプトの出力から作成しています。</p>
  <p class="ch">${pref ? `${esc(v.region)}の${esc(v.unitWord)}ごとの値` : `都道府県ごとの${v.pooled ? "計" : "中央値"}`}（${esc(o.unit || "")}）${pref ? "" : `<span class="note np" style="font-weight:400">　棒を押すと、その都道府県の${esc(v.unitWord)}ごとの値を表示します</span>`}</p>
  ${barsHtml(v, !pref)}
  <p class="note">縦線は${esc(v.refLabel)}。読む前に<a href="#caveats" id="to-cav">注意点</a>を確認してください。</p>
  <div class="actions">
    <button class="btn" type="button" id="dl">${pref ? `${esc(v.region)}のCSV（${nRows.toLocaleString("ja-JP")}行）` : `全国のCSV（${nRows.toLocaleString("ja-JP")}行）`}</button>
    ${pref ? "" : `<button class="btn ghost" type="button" id="dl-pref">都道府県計のCSV（${v.items.length}行）</button>`}
    <button class="btn ghost" type="button" id="prt">印刷・PDFにする</button>
    <button class="btn ghost" type="button" id="ask-res">この結果について質問する</button>
  </div>
  <p class="note np">CSVの見出しは日本語です。スクリプトの列名のままのCSVは <a href="${esc(doc.csv)}" download>${esc(doc.csv.split("/").pop())}</a>。Excelで開くとコードの先頭の0が消えることがあります。</p>
  <h4>${pref ? `${esc(v.region)}の表` : "都道府県ごとの表"}（${esc(SORTS[RS.sort])}）</h4>
  ${tableHtml(v)}
  ${reproHtml()}${recordHtml()}
  <p class="print-only note" id="prt-src"></p>`;

  $("rp").addEventListener("change", (e) => setResultState({ pref: e.target.value }));
  $("rsort").addEventListener("change", (e) => setResultState({ sort: e.target.value }));
  $("to-cav").addEventListener("click", (e) => { e.preventDefault(); $("caveats")?.scrollIntoView({ behavior: "smooth" }); });
  $("dl").addEventListener("click", () => downloadCsv(false));
  $("dl-pref")?.addEventListener("click", () => downloadCsv(true));
  $("prt").addEventListener("click", () => window.print());
  $("ask-res").addEventListener("click", () => setFocus(c.id, true));
  bindBars(v);
}

function setResultState(next) {
  Object.assign(RS, next);
  const qs = new URLSearchParams();
  if (RS.pref) qs.set("pref", RS.pref);
  if (RS.sort !== "desc") qs.set("sort", RS.sort);
  history.replaceState(null, "", `#ind-${toHash(RS.c.id)}${qs.toString() ? "?" + qs : ""}`);
  const y = $("res").getBoundingClientRect().top;
  drawResult();
  if (y < 0 || next.pref !== undefined) $("res").scrollIntoView({ block: "start" });
  $(next.sort !== undefined ? "rsort" : "rp")?.focus({ preventScroll: true });
}

// ツールチップ（値は表にもあるので、ここだけに出す情報はない）
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
function showTip(lines, x, y) {
  tip.replaceChildren(...lines.map(([t, k]) => { const e = document.createElement(k === "v" ? "b" : "div"); if (k === "s") e.className = "s"; e.textContent = t; return e; }));
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + "px";
  tip.style.top = Math.max(8, Math.min(y + 14, innerHeight - h - 8)) + "px";
}
function bindBars(v) {
  const { doc } = RS, { d, o } = v;
  const num = v.NUM !== null ? doc.columns[v.NUM] : null, den = v.DEN !== null ? doc.columns[v.DEN] : null;
  const lines = (x) => RS.pref
    ? [[`${fmt(x.v, d)} ${o.unit || ""}`, "v"], [x.name], ...(num ? [[`${num.label}：${fmtCell(num, x.r[v.NUM], d)}`, "s"], [`${den.label}：${fmtCell(den, x.r[v.DEN], d)}`, "s"]] : [])]
    : [[`${fmt(x.v, d)} ${o.unit || ""}`, "v"], [`${x.name}${v.pooled ? "計" : "の中央値"}`], ...(num ? [[`${num.label}の合計：${fmtCell(num, x.s.numerator_sum, d)}`, "s"], [`${den.label}の合計：${fmtCell(den, x.s.denominator_sum, d)}`, "s"]] : []), [`${x.s.n}${v.unitWord}・中央値 ${fmt(x.s.median, d)}`, "s"]];
  for (const b of document.querySelectorAll("#bars .br[data-i]")) {
    const x = v.items[+b.dataset.i];
    b.addEventListener("pointermove", (e) => showTip(lines(x), e.clientX, e.clientY));
    b.addEventListener("pointerleave", () => (tip.hidden = true));
    b.addEventListener("focus", () => { const r = b.getBoundingClientRect(); showTip(lines(x), r.left + r.width * 0.4, r.bottom - 8); });
    b.addEventListener("blur", () => (tip.hidden = true));
    if (b.tagName === "BUTTON") b.addEventListener("click", () => { tip.hidden = true; setResultState({ pref: x.code }); });
  }
}

function downloadCsv(prefTable) {
  const { c, doc } = RS, v = resultView();
  const q = (x) => { const t = x === null || x === undefined ? "" : String(x); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  let head, rows, name;
  if (prefTable) {
    const num = v.NUM !== null ? doc.columns[v.NUM] : null, den = v.DEN !== null ? doc.columns[v.DEN] : null;

  }
  const text = "﻿" + [head, ...rows].map((r) => r.map(q).join(",")).join("\r\n") + "\r\n";

// ---- 検索（文字の2文字組の重なりで近い資料を選ぶ） ---------------------------
const grams = (s) => { const t = String(s || "").replace(/\s+/g, ""); const g = new Set(); for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; };
let DOCS = null;
function buildDocs() {
  const items = [];
  for (const c of CAT.indicators) items.push({ id: `card:${c.id}`, kind: "card", title: c.name, href: `#ind-${toHash(c.id)}`, text: JSON.stringify(c), weight: 1.6 });
  for (const d of CAT.datasets) items.push({ id: `dataset:${d.id}`, kind: "dataset", title: d.title, href: `#ds-${toHash(d.id)}`, text: [d.title, d.publisher, d.attribution, ...(d.notes || [])].join("\n"), weight: 1.2 });
  for (const x of IDX) {
    if (x.type === "doc") items.push({ id: x.id, kind: "doc", title: x.title, href: gh(x.source), text: x.text, weight: 1.0 });
    else items.push({ id: x.id, kind: "col", title: `${x.dataset} の ${x.column}：${x.title}`, href: `#ds-${toHash(x.dataset)}`, text: `${x.column} ${x.title}（${x.required || "必須区分なし"}${x.zero_if_blank ? "、未回答は0" : ""}${x.secret ? "、秘匿の対象" : ""}）`, key: x.item || x.title, weight: 0.7 });
  }
  // 列は項目名（見出しの最後の段）だけで照合する。長い見出しの上位の段で、関係のない列が拾われるのを防ぐ
  for (const it of items) it.g = grams(it.kind === "col" ? it.key : it.title + " " + it.text.slice(0, 4000));
  return items;
}
function retrieve(q, focusId) {
  DOCS ||= buildDocs();
  const qg = grams(q);
  // 一致した2文字組の数（n）が少ない資料は、たまたま重なっただけとみなして使わない
  const MIN = { card: 1, dataset: 2, doc: 3, col: 3 };
  const scored = DOCS.map((it) => { let n = 0; for (const g of qg) if (it.g.has(g)) n++; return { it, n, s: (n / Math.sqrt(it.g.size + 20)) * it.weight }; })
    .filter((x) => x.n >= MIN[x.it.kind]).sort((a, b) => b.s - a.s);
  const pick = (kind, n) => scored.filter((x) => x.it.kind === kind).slice(0, n).map((x) => x.it);
  const sel = [...pick("card", 3), ...pick("dataset", 2), ...pick("doc", 3), ...pick("col", 6)];
  if (focusId && !sel.some((x) => x.id === `card:${focusId}`)) sel.unshift(DOCS.find((x) => x.id === `card:${focusId}`));
  const res = resultItem();
  if (res) sel.splice(sel.findIndex((x) => x?.id === `card:${focusId}`) + 1, 0, res);
  if (!sel.some((x) => x.kind === "card")) sel.push(...DOCS.filter((x) => x.kind === "card").slice(0, 3));
  return sel.filter(Boolean);
}

function systemPrompt(ctx) {
  return `あなたは「地域医療構想 オープンデータ指標カタログ」の案内役です。利用者は地域医療構想の分析に携わる研究者や行政職員です。
回答の決まり：
- 下の【資料】に書かれていることだけを根拠に、日本語で答える。資料にないことは推測で補わず、「作成者の説明はありません」または「このカタログでは確認できません」と書き、どの資料を見ればよいか（データの公表元、コードブック、GitHubのIssueで作成者に聞く等）を示す。
- 指標の意図・分母を選んだ理由・注意点を聞かれたら、指標カードの該当する欄の内容を、作成者の考えとして紹介する。あなた自身の評価は加えない。
- 数値（件数・割合・病床数など）は、資料に書かれているものしか書かない。計算して新しい数値を作らない。
- 【資料】に「result:」で始まる結果の表があるときは、その値は計算スクリプトが出したものなので、そのまま引用してよい。値を読み比べて答えるのはよいが、差・比・平均などの新しい数値は計算しない。値の意味は、指標カードの「読み方」と「注意点」に沿って説明し、注意点を1つ以上添える。
- 結果の表がない指標の値を聞かれたら、指標のページの「結果を見る」か、計算スクリプトの実行方法を案内する。
- 結論を先に、400字程度、長くても800字以内。
- 最後の行に、根拠にした資料のIDを「出典: card:xxx, doc:yyy」の形式で必ず書く。

【資料】
${ctx}`;
}
function contextOf(items) {
  let budget = 14000, out = [];
  for (const it of items) {
    let body = it.kind === "card" ? JSON.stringify(Object.fromEntries(Object.entries(JSON.parse(it.text)).filter(([k]) => !["authors", "created", "updated"].includes(k))), null, 1) : it.text;
    body = body.slice(0, it.kind === "card" ? 5000 : it.kind === "result" ? 4000 : 2200);
    if (budget - body.length < 0) break;
    budget -= body.length; out.push(`[${it.id}] ${it.title}\n${body}`);
  }
  return out.join("\n\n");
}
function renderAnswer(el, text, items, done) {
  const m = done ? text.match(/\n?\s*出典[:：]\s*([^\n]*)\s*$/) : null;
  const body = m ? text.slice(0, m.index) : text;
  const ids = m ? [...new Set(m[1].split(/[,、\s]+/).filter(Boolean))] : [];
  const lines = esc(body).split("\n"); let h = "", inList = false;
  for (const raw of lines) {
    const l = raw.trim(); const li = l.match(/^(?:[-*・]\s+|\d+[.)]\s+)(.*)$/);
    if (li) { if (!inList) { h += "<ul>"; inList = true; } h += `<li>${li[1].replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</li>`; continue; }
    if (inList) { h += "</ul>"; inList = false; }
    if (l) h += `<p>${l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")}</p>`;
  }
  if (inList) h += "</ul>";
  if (!h) h = `<p class="dots">考えています</p>`;
  const src = ids.map((id) => items.find((x) => x.id === id) || DOCS.find((x) => x.id === id)).filter(Boolean);
  if (done && src.length) h += `<div class="src">${src.map((s) => `<a href="${esc(s.href)}">${esc(s.title.slice(0, 40))}</a>`).join("")}</div>`;
  el.innerHTML = h;
}

async function callOpenAI(messages) {
  const url = settings.base.replace(/\/+$/, "") + "/chat/completions";
  const headers = { "Content-Type": "application/json" };
  if (settings.key) headers.Authorization = `Bearer ${settings.key}`;
  let r;
  try { r = await fetch(url, { method: "POST", headers, body: JSON.stringify({ model: settings.model, messages, temperature: 0.2 }) }); }
  catch (e) { throw new Error("接続できませんでした。URL、接続先の起動状態、CORSの許可（Ollamaなら OLLAMA_ORIGINS）を確認してください。"); }
  if (!r.ok) throw new Error(`接続先がエラーを返しました（${r.status}）。モデル名やAPIキーを確認してください。`);
  const j = await r.json();
  return j.choices?.[0]?.message?.content || "";
}

async function ask(q) {
  q = (q || "").trim(); if (!q || busy) return;
  busy = true; status(); $("q").value = ""; $("sug")?.remove();
  const u = document.createElement("div"); u.className = "m u"; u.textContent = q; $("log").appendChild(u);
  const a = document.createElement("div"); a.className = "m a"; $("log").appendChild(a);
  const items = retrieve(q, focusId);
  renderAnswer(a, "", items, false); a.scrollIntoView({ block: "end" });
  const sys = systemPrompt(contextOf(items));
  hist.push({ role: "user", content: q });
  const recent = hist.slice(-6); if (recent[0].role !== "user") recent.shift();
  try {
    let text;
    if (provider() === "claude") {
      const input = recent.map((m, i) => (i === 0 ? { role: "user", content: sys + "\n\n---\n利用者の質問：\n" + m.content } : m));
      const r = await sample(input, { cache: false, onText: ({ text }) => renderAnswer(a, text, items, false) });
      text = r.text;
    } else {
      text = await callOpenAI([{ role: "system", content: sys }, ...recent]);
    }
    renderAnswer(a, text, items, true);
    hist.push({ role: "assistant", content: text });
  } catch (e) {
    hist.pop();
    a.innerHTML = `<p>${esc(e?.code === "rate_limited" ? "利用が集中しています。少し時間をおいてください。" : e?.code === "not_granted" ? "Claudeの利用が許可されていません。" : e?.message || "回答を作成できませんでした。")}</p>`;
  } finally { busy = false; status(); a.scrollIntoView({ block: "end" }); }
}
$("f").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.isComposing) { e.preventDefault(); ask($("q").value); } });

// ---- 接続の設定 -------------------------------------------------------------
const dlg = $("dlg");
function syncOA() { $("oa").style.display = $("prov").value === "openai" ? "" : "none"; }
$("open-settings").addEventListener("click", () => {
  $("prov").value = provider(); $("base").value = settings.base || ""; $("model").value = settings.model || ""; $("key").value = settings.key || "";
  syncOA(); dlg.showModal();
});
$("prov").addEventListener("change", syncOA);
document.querySelectorAll("[data-base]").forEach((b) => b.addEventListener("click", () => { $("base").value = b.dataset.base; }));
dlg.addEventListener("close", () => {
  if (dlg.returnValue !== "save") return;
  settings = { provider: $("prov").value, base: $("base").value.trim(), model: $("model").value.trim(), key: $("key").value };
  try { localStorage.setItem("chiiki-od-chat", JSON.stringify(settings)); } catch (_) {}
  status();
});

// ---- 起動 -------------------------------------------------------------------
(async () => {
  try {
    const [c, s] = await Promise.all([fetch("catalog.json").then((r) => r.json()), fetch("search_index.json").then((r) => r.json())]);
    CAT = c; IDX = s.items || []; REPO = CAT.repo_url || "";
  } catch (e) {
    $("view").innerHTML = `<p>カタログを読み込めませんでした。<code>chiiki-od catalog</code> で site/catalog.json を作ってください。</p>`;
    return;
  }
  route(); renderSug(); status();
  for (let i = 0; i < 6 && !(window.claude && window.claude.use); i++) await new Promise((r) => setTimeout(r, 300));
  if (window.claude && window.claude.use) { try { sample = await window.claude.use("sample"); } catch (_) { sample = null; } }
  status();
})();
}
</script>
